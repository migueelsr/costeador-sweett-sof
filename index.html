<title>Costeador de Recetas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: una sola columna centrada. Inicio, Recetas (lista), página de receta (datos, ingredientes, costeo, PDF) e Inventario. Colores sacados del logo de Sweett Sof: azul pastel y café chocolate. */
:root{
  --bg:#F4F7FD; --surface:#FFFFFF; --surface2:#E9EFFB; --ink:#2B211C; --ink2:#6A5F58; --line:#D9E1F2;
  --accent:#8A4B28; --accent-ink:#FFFFFF; --accent-soft:#F3E4D9;
  --blue:#AEC6FB; --blue-ink:#2B211C;
  --good:#1F7A4D; --good-soft:#D9EFE2; --warn:#8F5600; --warn-soft:#FBEBCF; --bad:#B3261E; --bad-soft:#F7DAD7;
  --s1:#8A4B28; --s2:#C98B62; --s3:#5B7FD0; --s4:#D4A12A; --s5:#7B8794;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171E; --surface:#1C2029; --surface2:#262C38; --ink:#F0E9E4; --ink2:#A9A19B; --line:#333A48;
    --accent:#E3A87E; --accent-ink:#2A160B; --accent-soft:#3A2A20;
    --blue:#3B4B76; --blue-ink:#F0E9E4;
    --good:#5CC38D; --good-soft:#1B3A2A; --warn:#E0A33C; --warn-soft:#3D2E12; --bad:#F0847C; --bad-soft:#43211F;
    --s1:#E3A87E; --s2:#A9704A; --s3:#8DA8F0; --s4:#E3B84A; --s5:#9AA5B3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14171E; --surface:#1C2029; --surface2:#262C38; --ink:#F0E9E4; --ink2:#A9A19B; --line:#333A48;
  --accent:#E3A87E; --accent-ink:#2A160B; --accent-soft:#3A2A20;
  --blue:#3B4B76; --blue-ink:#F0E9E4;
  --good:#5CC38D; --good-soft:#1B3A2A; --warn:#E0A33C; --warn-soft:#3D2E12; --bad:#F0847C; --bad-soft:#43211F;
  --s1:#E3A87E; --s2:#A9704A; --s3:#8DA8F0; --s4:#E3B84A; --s5:#9AA5B3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
#app{max-width:860px;margin:0 auto;padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
label,th,.label{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px}
.brand{display:flex;align-items:center;gap:12px}
.logo{border-radius:50%;background:#fff;display:block;flex:none}
.brand b{font-family:var(--font-display);font-size:18px;display:block;line-height:1.1}
.brand span{font-size:12.5px;color:var(--ink2)}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:10px}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--accent)}
.tab:hover:not([aria-selected="true"]){color:var(--ink)}
@media (max-width:560px){.tabs{width:100%}.tab{flex:1;padding:10px 6px}}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:7px;cursor:pointer;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.big{min-height:48px;padding:10px 22px;font-size:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 11px;min-height:40px;width:100%;min-width:0}
input[type=number]{font-family:var(--font-mono);text-align:right}
textarea{resize:vertical;line-height:1.5}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.form-grid .wide{grid-column:1/-1}

.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:10px 14px}
.banner p{flex:1 1 280px;font-size:14px}
.hint{color:var(--ink2);font-size:13.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.page-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

.hero{background:var(--blue);color:var(--blue-ink);border-radius:14px;padding:22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.hero h1{margin-bottom:4px}
.hero p{max-width:44ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.stat .v{font-family:var(--font-display);font-size:28px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.stat .label{display:block}
@media (max-width:560px){.stat .v{font-size:21px}.stat{padding:10px}}

.list{display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer}
.rrow:hover{border-color:var(--accent)}
.rrow .nm{font-weight:600;font-size:16px}
.rrow .meta{color:var(--ink2);font-size:13px}
.rrow .nums{display:flex;gap:22px;text-align:right}
.rrow .nums .label{display:block;font-size:10.5px}
.rrow .nums b{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
.empty{color:var(--ink2);text-align:center;padding:26px 12px}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ink);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th.r,td.r{text-align:right}
.ing{min-width:500px}
.ing td:nth-child(2){width:110px}
.ing td:nth-child(3){width:84px}
.ing td.num{white-space:nowrap}
.ing input,.ing select{min-height:36px;padding:5px 8px}
tfoot td{font-weight:600;border-bottom:0;border-top:2px solid var(--ink)}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.extra{background:var(--accent-soft);color:var(--accent)}
.x{border:0;background:transparent;cursor:pointer;color:var(--ink2);font-size:20px;line-height:1;padding:6px 9px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.pill{font-family:var(--font-mono);font-size:12.5px;color:var(--ink2)}

.addbox{background:var(--surface2);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.addbox .btn{align-self:flex-start}
.extra-box{background:var(--accent-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}

.seg{display:inline-flex;border:1px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:10px 20px;cursor:pointer;font-weight:600}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.metric{border-top:3px solid var(--ink);padding-top:8px;min-width:0}
.metric.hi{border-top-color:var(--accent)}
.metric .v{font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.metric.hi .v{color:var(--accent)}
@media (max-width:560px){.metric .v{font-size:20px}.metrics{gap:8px}}

.panel td{padding:8px 4px}
.panel td.k{color:var(--ink2)}
.panel tr.strong td{font-weight:600;color:var(--ink)}
.panel tr.final td{border-top:2px solid var(--accent);border-bottom:0;font-weight:700;color:var(--accent);font-size:16px}
.inl{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.inl input{width:92px;min-height:34px;padding:3px 8px}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.share{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--surface2)}
.share i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--ink2)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-top:4px}
[hidden]{display:none!important}
.row2{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.subrow td{background:var(--surface2)}
.lots{min-width:480px}
details summary{cursor:pointer;font-weight:600;color:var(--ink2)}
details[open] summary{margin-bottom:12px}

.modal{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.box{background:var(--surface);border:1px solid var(--ink);border-radius:10px;padding:20px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:7px;z-index:60;max-width:calc(100% - 32px);font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

/* ---------- utilidades ---------- */
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var clp=new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});
function nf(d){return new Intl.NumberFormat('es-CL',{maximumFractionDigits:d});}
function money(n){return isFinite(n)?clp.format(Math.round(n)):'—';}
function fnum(n,d){return isFinite(n)?nf(d==null?3:d).format(n):'—';}
function pct(n){return isFinite(n)?nf(1).format(n*100)+' %':'—';}
function num(v){var x=parseFloat(String(v).replace(',','.'));return isFinite(x)&&x>0?x:0;}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}

function fdate(s){try{var p=s.split('-');return p[2]+'-'+p[1]+'-'+p[0];}catch(e){return s;}}
function sum(a){return a.reduce(function(t,x){return t+x;},0);}

/* ---------- inventario FIFO ---------- */
function insById(id){for(var i=0;i<S.insumos.length;i++)if(S.insumos[i].id===id)return S.insumos[i];return null;}
function findIns(name){var n=norm(name);if(!n)return null;for(var i=0;i<S.insumos.length;i++)if(norm(S.insumos[i].name)===n)return S.insumos[i];return null;}
function lotsSorted(ins){return ins.lots.filter(function(l){return l.left>1e-9;}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:(a.id<b.id?-1:1);});}
function lastPrice(ins){if(!ins.lots.length)return ins.refPrice||0;var a=ins.lots.slice().sort(function(x,y){return x.date<y.date?1:x.date>y.date?-1:(x.id<y.id?1:-1);});return a[0].price;}
function unitPrice(ins){var s=lotsSorted(ins);return s.length?s[0].price:lastPrice(ins);}
function stock(ins){return sum(ins.lots.map(function(l){return l.left;}));}
function fifoCost(ins,q){
  if(!ins.lots.length)return {cost:q*(ins.refPrice||0),short:0};
  var rem=q,cost=0,ls=lotsSorted(ins);
  for(var i=0;i<ls.length&&rem>1e-12;i++){var t=Math.min(ls[i].left,rem);cost+=t*ls[i].price;rem-=t;}
  var short=0;if(rem>1e-9){short=rem;cost+=rem*lastPrice(ins);}
  return {cost:cost,short:short};
}
function consume(ins,q){
  var rem=q,cost=0,ls=lotsSorted(ins);
  for(var i=0;i<ls.length&&rem>1e-12;i++){var t=Math.min(ls[i].left,rem);ls[i].left-=t;rem-=t;cost+=t*ls[i].price;}
  return {cost:cost,short:rem>1e-9?rem:0};
}

/* ---------- cálculo de recetas ---------- */
function cur(){for(var i=0;i<S.recetas.length;i++)if(S.recetas[i].id===S.ui.recetaId)return S.recetas[i];return null;}
function baseQty(it){return num(it.qty)*(UNITS[it.unit]||UNITS.kg).f;}
function calc(r){
  var por=Math.max(1,num(r.porciones)||1);
  var lines=r.items.map(function(it){
    var ins=insById(it.insumoId);
    if(!ins)return {id:it.id,cost:0,has:false};
    var q=baseQty(it),f=fifoCost(ins,q),up=unitPrice(ins);
    return {id:it.id,cost:f.cost,has:true,up:up,ub:ins.unit,short:f.short,noPrice:q>0&&up<=0};
  });
  var mp=sum(lines.map(function(l){return l.cost;}));
  var k={},p=r.pro,m=num(r.makeup)/100;
  k.mp=mp;k.mpP=mp/por;
  k.sub=mp*(1+m);k.subP=k.sub/por;k.factor=1+m;k.iva=k.sub*IVA;k.ivaP=k.iva/por;k.bruto=k.sub+k.iva;k.brutoP=k.bruto/por;k.ratio=k.bruto>0?mp/k.bruto:0;
  k.merma=mp*num(p.merma)/100;k.mo=(num(p.min)/60)*num(p.hora);k.gas=num(p.gas);k.env=num(p.env);
  k.costo=mp+k.merma+k.mo+k.gas+k.env;k.costoP=k.costo/por;
  ['merma','mo','gas','env'].forEach(function(x){k[x+'P']=k[x]/por;});
  var mg=Math.min(num(p.margen)/100,0.95);
  k.neto=k.costo/(1-mg);k.netoP=k.neto/por;k.ivaPro=k.neto*IVA;k.ivaProP=k.ivaPro/por;k.brutoPro=k.neto+k.ivaPro;k.brutoProP=k.brutoPro/por;
  var red=num(p.red)||1;k.sugP=Math.ceil(k.brutoProP/red-1e-9)*red;k.sugTot=k.sugP*por;
  var netoSug=k.sugP/(1+IVA);k.ganP=netoSug-k.costoP;k.ganTot=k.ganP*por;k.margenReal=netoSug>0?k.ganP/netoSug:0;
  k.fc=netoSug>0?(k.mpP+k.mermaP)/netoSug:0;
  [mp,k.merma,k.mo,k.gas,k.env].forEach(function(v,i){k['sh'+(i+1)]=k.costo>0?v/k.costo:0;});
  return {lines:lines,k:k,por:por};
}

      '<div class="field"><label for="n-cat">Categoría</label><select id="n-cat">'+CATS.map(function(c){return '<option>'+c+'</option>';}).join('')+'</select></div>'+

}

function render(){
  var t=S.ui.tab;
  var v=t==='inventario'?invView():t==='receta'?recetaView():t==='recetas'?recetasView():inicioView();
  app.innerHTML=header()+v+modal();
  paint();
  if(dlg){var b=document.getElementById('dlg-ok');if(b)b.focus();}
}
function go(tab){S.ui.tab=tab;persist();render();window.scrollTo(0,0);}

function setC(tr,c,txt){var el=tr.querySelector('[data-c="'+c+'"]');if(el)el.textContent=txt;}
function paint(){
  if(S.ui.tab!=='receta')return;
  var r=cur();if(!r)return;
  var c=calc(r),k=c.k;
  c.lines.forEach(function(l){
    var tr=app.querySelector('[data-row="'+l.id+'"]');if(!tr)return;
    setC(tr,'unit',l.has?money(l.up)+' por '+l.ub:'');
    setC(tr,'cost',l.has?money(l.cost):'—');
    var f=tr.querySelector('[data-c="flag"]');
    if(f)f.innerHTML=!l.has?'':l.short>0?'<span class="chip bad">saldo insuficiente</span>':l.noPrice?'<span class="chip warn">sin precio</span>':'';
  });
  app.querySelectorAll('[data-k]').forEach(function(el){
    var v=k[el.dataset.k],f=el.dataset.fmt;
    el.textContent=f==='pct'?pct(v):f==='x'?'× '+fnum(v,2):money(v);
  });
  app.querySelectorAll('[data-seg]').forEach(function(el){el.style.width=(k[el.dataset.seg]*100)+'%';});
}

/* ---------- avisos y confirmaciones ---------- */
var toastT=null;
function toast(msg,err){var t=document.getElementById('toast');t.textContent=msg;t.className='on'+(err?' err':'');clearTimeout(toastT);toastT=setTimeout(function(){t.className='';},3800);}
function ask(msg,label,fn){dlg={msg:msg,label:label,ok:fn};render();}

/* ---------- formulario de ingredientes ---------- */
function updateAddHint(){
  var p=$('#a-prod');if(!p)return;
  var name=p.value.trim(),ins=findIns(name),ex=$('#a-extra'),us=$('#a-unit');
  ex.hidden=!name||!!ins;
  if(!ex.hidden)$('#a-xn').textContent='«'+name+'»';
  var fam=ins?FAM[ins.unit]:ALLU;
  var have=[].map.call(us.options,function(o){return o.value;}).join(',');
  if(have!==fam.join(','))us.innerHTML=unitOpts(ins,us.value);
  $('#a-price-l').textContent='Precio por '+BASEWORD[UNITS[us.value].base]+' ($)';
}
function addIng(){
  var r=cur();if(!r)return;
  var name=$('#a-prod').value.trim(),q=num($('#a-qty').value),u=$('#a-unit').value;
  if(!name){toast('Elige o escribe el producto.',true);$('#a-prod').focus();return;}
  if(q<=0){toast('Escribe la cantidad.',true);$('#a-qty').focus();return;}
  var ins=findIns(name);
  if(!ins){ins={id:uid(),name:name,cat:'Extra',unit:UNITS[u].base,refPrice:num($('#a-price').value),lots:[],extra:true};S.insumos.push(ins);}
  else if(UNITS[u].base!==ins.unit){toast('«'+ins.name+'» se mide en '+ins.unit+'. Cambia la unidad.',true);return;}
  r.items.push({id:uid(),insumoId:ins.id,qty:q,unit:u});
  persist();render();
  var p=$('#a-prod');if(p)p.focus();
}

/* ---------- eventos ---------- */
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='a-prod'){updateAddHint();return;}
  if(t.id==='inv-q'){S.ui.q=t.value;var pos=t.selectionStart;render();var n=document.getElementById('inv-q');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}return;}
  if(t.id==='c-qty'||t.id==='c-total'){updateCompraCalc();return;}
  var f=t.dataset.f,sc=t.dataset.scope;if(!f)return;
  var r=cur();
  if(sc==='r'&&r){r[f]=(f==='makeup'||f==='porciones')?num(t.value):t.value;}
  else if(sc==='pro'&&r){r.pro[f]=num(t.value);}
  else if(sc==='row'&&r&&f==='qty'){var it=r.items.find(function(x){return x.id===t.dataset.id;});if(it)it.qty=t.value===''?0:num(t.value);}
  else if(sc==='ins'&&f==='refPrice'){var ins=insById(t.dataset.id);if(ins)ins.refPrice=num(t.value);}
  else return;
  persist();paint();
});
function updateCompraCalc(){
  var q=num($('#c-qty').value),tt=num($('#c-total').value),u=$('#c-unit').value,base=q*UNITS[u].f;
  $('#c-calc').textContent=base>0&&tt>0?'= '+money(tt/base)+' por '+UNITS[u].base:'';
}

app.addEventListener('change',function(e){
  var t=e.target,f=t.dataset.f,sc=t.dataset.scope,r=cur();
  if(t.id==='a-unit'){updateAddHint();return;}
  if(t.id==='a-prod'){updateAddHint();return;}
  if(t.id==='c-unit'){updateCompraCalc();return;}
  if(t.id==='imp-file'){var file=t.files&&t.files[0];if(!file)return;var rd=new FileReader();rd.onload=function(){importText(String(rd.result));};rd.readAsText(file);return;}
  if(!f)return;
  if(sc==='r'&&r){if(f==='name'||f==='cat'){persist();var h=app.querySelector('h1');if(h)h.textContent=r.name||'Nueva receta';}return;}
  if(sc==='pro'&&r){if(f==='red'){r.pro.red=num(t.value);persist();paint();}return;}
  if(sc==='ins'){var ins=insById(t.dataset.id);if(!ins)return;if(f==='name'){var nn=t.value.trim();if(nn)ins.name=nn;}else if(f==='cat'){ins.cat=t.value;}persist();render();return;}
  if(sc==='row'&&r&&f==='unit'){var it=r.items.find(function(x){return x.id===t.dataset.id;});if(it){it.unit=t.value;persist();paint();}}
});

app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(e.target.id==='a-qty'||e.target.id==='a-price')){e.preventDefault();addIng();}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&dlg){dlg=null;render();}});

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act,id=b.dataset.id,r=cur();
  if(a==='tab'){if(S.ui.tab==='receta')leaveRecipe();go(b.dataset.v);}
  else if(a==='mode'){S.ui.mode=b.dataset.v;persist();render();}
  else if(a==='banner-ok'){S.ui.banner=false;persist();render();}
  else if(a==='go-compra'){S.ui.compra=true;S.ui.nuevo=false;go('inventario');var c=$('#c-prod');if(c)c.focus();}
  else if(a==='r-new'){var n={id:uid(),name:'',cat:'',porciones:1,tiempo:'',notas:'',items:[],makeup:30,pro:defPro(),draft:true};S.recetas.push(n);S.ui.recetaId=n.id;go('receta');var nm=$('#r-name');if(nm)nm.focus();}
  else if(a==='r-open'){S.ui.recetaId=id;go('receta');}
  else if(a==='r-back'){leaveRecipe();go('recetas');}
  else if(a==='r-save'&&r){if(!r.name.trim()){toast('Ponle un nombre a la receta.',true);$('#r-name').focus();return;}r.draft=false;persist();go('recetas');toast('Receta guardada.');}
  else if(a==='r-del'&&r){ask('¿Eliminar la receta «'+(r.name||'sin nombre')+'»? No se puede deshacer.','Eliminar',function(){S.recetas=S.recetas.filter(function(x){return x.id!==r.id;});S.ui.recetaId=S.recetas.length?S.recetas[0].id:null;S.ui.tab='recetas';});}
  else if(a==='ing-add')addIng();
  else if(a==='row-del'&&r){r.items=r.items.filter(function(x){return x.id!==id;});persist();render();}
  else if(a==='ins-toggle'){S.ui.open[id]=!S.ui.open[id];persist();render();}
  else if(a==='ins-del'){var ins=insById(id);if(ins)ask('¿Eliminar «'+ins.name+'»? También se quita de las recetas que lo usan.','Eliminar',function(){S.insumos=S.insumos.filter(function(x){return x.id!==id;});S.recetas.forEach(function(rr){rr.items=rr.items.filter(function(x){return x.insumoId!==id;});});});}
  else if(a==='lot-del'){var i2=insById(id);if(i2){i2.lots=i2.lots.filter(function(l){return l.id!==b.dataset.lot;});persist();render();}}
  else if(a==='compra-toggle'){S.ui.compra=!S.ui.compra;S.ui.nuevo=false;persist();render();if(S.ui.compra){var c2=$('#c-prod');if(c2)c2.focus();}}
  else if(a==='nuevo-toggle'){S.ui.nuevo=!S.ui.nuevo;S.ui.compra=false;persist();render();if(S.ui.nuevo){var n2=$('#n-name');if(n2)n2.focus();}}
  else if(a==='compra-save')saveCompra();
  else if(a==='nuevo-save')saveNuevo();
  else if(a==='producir')producir();
  else if(a==='pdf')downloadPdf();
  else if(a==='export')exportData();
  else if(a==='import-text')importText($('#imp-text').value);
  else if(a==='reset-example')ask('Esto reemplaza todo lo que tienes por los datos de ejemplo de la ficha.','Reemplazar',function(){S=seed();});
  else if(a==='wipe')ask('¿Borrar todos los productos, compras y recetas? No se puede deshacer.','Borrar todo',function(){S=normState({insumos:[],recetas:[],mov:[],ui:{}});});
  else if(a==='dlg-no'){dlg=null;render();}
  else if(a==='dlg-ok'){var fn=dlg&&dlg.ok;dlg=null;if(fn)fn();persist();render();}
});
function leaveRecipe(){
  var r=cur();if(!r||!r.draft)return;
  if(!r.name.trim()&&!r.items.length){S.recetas=S.recetas.filter(function(x){return x.id!==r.id;});S.ui.recetaId=S.recetas.length?S.recetas[S.recetas.length-1].id:null;}
  else r.draft=false;
  persist();
}

/* ---------- acciones de inventario ---------- */
function saveCompra(){
  var name=$('#c-prod').value.trim(),date=$('#c-date').value||today();
  var q=num($('#c-qty').value),u=$('#c-unit').value,tot=num($('#c-total').value);
  if(!name)return toast('Elige o escribe el producto.',true);
  if(q<=0)return toast('Escribe la cantidad comprada.',true);
  if(tot<=0)return toast('Escribe el precio total pagado.',true);
  var ins=findIns(name);
  if(!ins){ins={id:uid(),name:name,cat:'Extra',unit:UNITS[u].base,refPrice:0,lots:[],extra:true};S.insumos.push(ins);}
  if(UNITS[u].base!==ins.unit)return toast('«'+ins.name+'» se mide en '+ins.unit+'. Cambia la unidad de la compra.',true);
  var base=q*UNITS[u].f;
  ins.lots.push({id:uid(),date:date,qty:base,left:base,price:tot/base});
  if(!ins.refPrice)ins.refPrice=tot/base;
  S.ui.compra=false;persist();render();toast('Compra guardada: '+money(tot/base)+' por '+ins.unit+'.');
}
function saveNuevo(){
  var name=$('#n-name').value.trim();
  if(!name)return toast('Escribe el nombre del producto.',true);
  if(findIns(name))return toast('Ese producto ya existe.',true);
  S.insumos.push({id:uid(),name:name,cat:$('#n-cat').value,unit:$('#n-unit').value,refPrice:num($('#n-ref').value),lots:[]});
  S.ui.nuevo=false;persist();render();toast('Producto agregado.');
}
function producir(){
  var r=cur();if(!r)return;
  var t=num($('#p-tandas').value)||1;
  var used=r.items.filter(function(it){var i=insById(it.insumoId);return i&&i.lots.length&&baseQty(it)>0;});
  if(!used.length)return toast('Ningún ingrediente de esta receta tiene compras registradas. Registra compras en Inventario.',true);
  ask('Se descontarán '+used.length+' productos del inventario por '+fnum(t)+' tanda(s), usando primero las compras más antiguas.','Producir',function(){
    var cost=0,short=0;
    used.forEach(function(it){var i=insById(it.insumoId),c=consume(i,baseQty(it)*t);cost+=c.cost;if(c.short>0)short++;});
    S.mov.push({id:uid(),date:today(),recipe:r.name,tandas:t,cost:cost});
    setTimeout(function(){toast('Inventario descontado. Costo FIFO real: '+money(cost)+(short?'. Faltó saldo en '+short+' producto(s).':'.'),!!short);},30);
  });
}

/* ---------- copia de seguridad ---------- */
function exportData(){
  var text=JSON.stringify(S,null,2),name='sweett-sof-copia-'+today()+'.json';
  function fallback(){
    try{var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Copia descargada.');}
    catch(x){var box=$('#exp-box');if(box)box.innerHTML='<div class="field" style="margin-top:12px"><label for="exp-t">Copia este texto y guárdalo</label><textarea id="exp-t" rows="5" readonly></textarea></div>';var ta=$('#exp-t');if(ta){ta.value=text;ta.select();}}
  }
  saveFile(name,text,fallback,'Copia guardada.');
}
function saveFile(name,data,fallback,okMsg){
  if(window.claude&&window.claude.use){
    window.claude.use('downloads').then(function(dl){
      if(!dl)return fallback();
      dl.save({filename:name,data:data}).then(function(){toast(okMsg);}).catch(function(err){if(err&&err.code==='declined')return;toast('No se pudo guardar el archivo.',true);});
    }).catch(fallback);
  }else fallback();
}
function importText(txt){
  try{
    var s=JSON.parse(txt);
    if(!s||!Array.isArray(s.insumos)||!Array.isArray(s.recetas))throw new Error('formato');
    S=normState(s);S.ui.tab='inicio';persist();render();toast('Copia cargada.');
  }catch(e){toast('Ese archivo no es una copia válida.',true);}
}

/* ---------- PDF ---------- */
function pm(n){return money(n).replace(/[  ]/g,' ');}
function pp(n){return pct(n).replace(/[  ]/g,' ');}
function downloadPdf(){
  var r=cur();if(!r)return;
  if(!window.jspdf||!window.jspdf.jsPDF){return toast('No se pudo cargar el generador de PDF. Revisa tu conexión e intenta de nuevo.',true);}
  var doc,name=(norm(r.name||'receta').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'receta')+'.pdf';
  try{doc=buildPdf(r);}catch(err){return toast('No se pudo armar el PDF.',true);}
  var buf=doc.output('arraybuffer');
  saveFile(name,buf,function(){doc.save(name);toast('PDF descargado.');},'PDF guardado.');
}
function buildPdf(r){
  var jsPDF=window.jspdf.jsPDF,doc=new jsPDF({unit:'mm',format:'a4'});
  var c=calc(r),k=c.k,uni=S.ui.mode==='uni',W=210,M=16,BR=[138,75,40],BL=[174,198,251],INK=[43,33,28];
  doc.setFillColor(BL[0],BL[1],BL[2]);doc.rect(0,0,W,34,'F');
  doc.addImage(LOGO,'PNG',M,5,24,24);
  doc.setTextColor(INK[0],INK[1],INK[2]);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text('Sweett Sof Pastelería',M+30,16);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('@sweett_sof',M+30,22);
  doc.text(uni?'Ficha de costeo':'Costeo profesional',W-M,15,{align:'right'});
  doc.text(fdate(today()),W-M,21,{align:'right'});
  doc.setTextColor(BR[0],BR[1],BR[2]);doc.setFont('helvetica','bold');doc.setFontSize(17);
  var title=doc.splitTextToSize(r.name||'Receta sin nombre',W-2*M);doc.text(title,M,46);
  var y=46+title.length*7;
  doc.setTextColor(90,80,72);doc.setFont('helvetica','normal');doc.setFontSize(10);
  doc.text([r.cat||'Sin categoría',fnum(r.porciones,1)+' porción(es)',r.tiempo?'Tiempo: '+r.tiempo:''].filter(Boolean).join('  ·  '),M,y);
  y+=6;
  var body=r.items.map(function(it){
    var ins=insById(it.insumoId),l=c.lines.filter(function(x){return x.id===it.id;})[0]||{};
    return [ins?ins.name:'(eliminado)',fnum(it.qty)+' '+it.unit,l.has?pm(l.up)+' / '+l.ub:'—',l.has?pm(l.cost):'—'];
  });
  var common={styles:{font:'helvetica',fontSize:9.5,textColor:INK,cellPadding:2},headStyles:{fillColor:BR,textColor:255},margin:{left:M,right:M}};
  doc.autoTable(Object.assign({},common,{startY:y,head:[['Ingrediente','Cantidad','Precio unitario','Costo']],body:body,
    foot:[['Costo de receta (materia prima)','','',pm(k.mp)]],footStyles:{fillColor:[233,239,251],textColor:INK,fontStyle:'bold'},
    columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'}}}));
  y=doc.lastAutoTable.finalY+8;
  if(y>215){doc.addPage();y=18;}
  var rows,boldRows;
  if(uni){
    rows=[['Costo de receta (M.P.)',pm(k.mp),pm(k.mpP)],['Make up '+fnum(r.makeup,1)+' % (factor '+fnum(k.factor,2)+')','',''],['Subtotal',pm(k.sub),pm(k.subP)],['IVA 19%',pm(k.iva),pm(k.ivaP)],['Precio bruto',pm(k.bruto),pm(k.brutoP)],['% ratio de costo',pp(k.ratio),'']];
    boldRows=[4];
  }else{
    rows=[['Insumos (M.P.)',pm(k.mp),pm(k.mpP)],['Merma '+fnum(r.pro.merma,1)+' %',pm(k.merma),pm(k.mermaP)],['Mano de obra ('+fnum(r.pro.min,0)+' min a '+pm(r.pro.hora)+'/h)',pm(k.mo),pm(k.moP)],['Gas, luz y otros',pm(k.gas),pm(k.gasP)],['Envases',pm(k.env),pm(k.envP)],['Costo total',pm(k.costo),pm(k.costoP)],['Precio neto con margen '+fnum(r.pro.margen,1)+' %',pm(k.neto),pm(k.netoP)],['IVA 19%',pm(k.ivaPro),pm(k.ivaProP)],['Precio con IVA',pm(k.brutoPro),pm(k.brutoProP)],['Precio sugerido (redondeado)',pm(k.sugTot),pm(k.sugP)],['Ganancia neta',pm(k.ganTot),pm(k.ganP)],['Margen real',pp(k.margenReal),'']];
    boldRows=[5,9];
  }
  doc.autoTable(Object.assign({},common,{startY:y,head:[['Costeo',uni?'Total':'Tanda','Por porción']],body:rows,
    columnStyles:{1:{halign:'right'},2:{halign:'right'}},
    didParseCell:function(d){if(d.section==='body'&&boldRows.indexOf(d.row.index)>=0){d.cell.styles.fontStyle='bold';d.cell.styles.textColor=BR;}}}));
  y=doc.lastAutoTable.finalY+8;
  if(r.notas&&r.notas.trim()){
    if(y>250){doc.addPage();y=18;}
    doc.setFont('helvetica','bold');doc.setFontSize(11);doc.setTextColor(BR[0],BR[1],BR[2]);doc.text('Procedimiento y puntos críticos',M,y);y+=6;
    doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.splitTextToSize(r.notas,W-2*M).forEach(function(line){if(y>280){doc.addPage();y=18;}doc.text(line,M,y);y+=4.6;});
  }
  var n=doc.getNumberOfPages();
  for(var p=1;p<=n;p++){doc.setPage(p);doc.setFontSize(8.5);doc.setTextColor(120,110,104);doc.text('Sweett Sof Pastelería · @sweett_sof · Precios en pesos chilenos',M,290);doc.text('Página '+p+' de '+n,W-M,290,{align:'right'});}
  return doc;
}

render();
})();
</script>
